[package]
name = "kiln"
version = "0.1.0"
edition = "2024"
description = "A from-scratch LLM inference engine: BPE tokenizer, Llama forward pass, KV cache, sampling."
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
half = "2.7.1"
memmap2 = "0.9.12"
rayon = "1.12.0"
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
debug = "line-tables-only" # readable flame graphs later, no runtime cost
codegen-units = 1
lto = "thin"

# The test suite runs a 135M-parameter model; an unoptimized build makes it crawl.
[profile.test]
opt-level = 3

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "matmul"
harness = false

[[bench]]
name = "e2e"
harness = false
